name: 前端 - 构建并推送 SWR 镜像及部署

on:
  push:
    branches:
      - master


    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
      - '.image/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  SWR_ORGANIZATION: zhicang
  IMAGE_NAME: swr.cn-south-1.myhuaweicloud.com/zhicang/yudao-ui

jobs:

  # ─────────────────────────────────────────────
  # Job 1: 应用编译与镜像打包
  # ─────────────────────────────────────────────
  build:
    name: 构建镜像并导出产物
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}
          labels: |
            org.opencontainers.image.title=yudao-ui-admin-vue3
            org.opencontainers.image.description=芋道管理后台 Vue3
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 本地构建 Docker 镜像包
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/frontend.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: 上传离线镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 2: 推送到华为云 SWR 镜像服务
  # ─────────────────────────────────────────────
  push:
    name: 推送镜像至 SWR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 下载离线镜像产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: 加载镜像到本地引擎
        run: |
          docker load --input /tmp/frontend.tar

      - name: 登录华为云 SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: 推送镜像至 SWR
        run: |
          docker push --all-tags ${{ env.IMAGE_NAME }}

  # ─────────────────────────────────────────────
  # Job 3: 服务器密码登录与自动部署
  # ─────────────────────────────────────────────
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: push

    if: github.ref_name == 'master' || github.ref_name == 'main'

    steps:
      - name: SSH 远程部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SERVER_USERNAME || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          request_pty: true
          script: |
            cd /opt/1panel/docker/compose/zhicang
            sudo docker login -u ${{ secrets.SWR_USERNAME }} -p ${{ secrets.SWR_PASSWORD }} ${{ env.REGISTRY }}
            sudo docker compose pull yudao-ui
            sudo docker compose up -d yudao-ui
            sudo docker image prune -f

      - name: 输出部署结果
        run: |
          echo "## ✅ 前端部署成功" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | \`${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 服务器 | \`${{ secrets.SERVER_HOST }}\` |" >> $GITHUB_STEP_SUMMARY

